<title>車主法規快報</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">
<style>
/* 版面：單欄公告欄。左邊日期欄、右邊內容；手機寬度時日期移到內容上方。 */
:root {
  --bg: #f3f5f6;
  --surface: #ffffff;
  --ink: #16232b;
  --muted: #5b6b75;
  --line: #d6dde1;
  --accent: #0b5f6b;        /* 公路標誌的深藍綠 */
  --accent-soft: #dcebed;
  --ok: #1f6b3a;            /* 已施行 */
  --ok-soft: #dff0e4;
  --draft: #8a5a00;         /* 草案 */
  --draft-soft: #fbedc9;
  --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10181c; --surface: #18232a; --ink: #e6edf0; --muted: #9aabb4; --line: #2b3a43;
    --accent: #6cc3cf; --accent-soft: #1d3b41; --ok: #7fd09a; --ok-soft: #1b3a26;
    --draft: #f0c060; --draft-soft: #40320f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10181c; --surface: #18232a; --ink: #e6edf0; --muted: #9aabb4; --line: #2b3a43;
  --accent: #6cc3cf; --accent-soft: #1d3b41; --ok: #7fd09a; --ok-soft: #1b3a26;
  --draft: #f0c060; --draft-soft: #40320f; color-scheme: dark;
}
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.7;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1 { font-family: var(--font-display); font-size: 30px; line-height: 1.25; margin: 0; letter-spacing: .02em; }
.lede { color: var(--muted); margin: 6px 0 0; font-size: 15px; }
.meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 16px; font-variant-numeric: tabular-nums; }
.notice { background: var(--draft-soft); color: var(--ink); border-radius: 8px; padding: 10px 14px; font-size: 14px; }
.filters { display: flex; flex-direction: column; gap: 10px; }
.group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.group span { font-size: 13px; color: var(--muted); min-width: 3em; }
button.chip {
  font: inherit; font-size: 14px; padding: 5px 13px; border-radius: 999px; cursor: pointer;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line);
}
button.chip[aria-pressed="true"] { background: var(--accent); color: var(--surface); border-color: var(--accent); }
button.chip:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.count { font-size: 13px; color: var(--muted); }
.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.item { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 16px; padding: 18px 18px 16px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.date { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; line-height: 1.4; padding-top: 4px; }
.date b { display: block; font-size: 20px; color: var(--ink); font-weight: 700; }
.body { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; }
.tag { padding: 1px 8px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.draft { background: var(--draft-soft); color: var(--draft); }
.tag.plain { background: transparent; color: var(--muted); border: 1px solid var(--line); }
h2 { font-size: 18px; line-height: 1.45; margin: 0; font-weight: 700; text-wrap: balance; }
ul.points { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; font-size: 15px; }
.impact { font-size: 14px; color: var(--muted); margin: 0; }
.impact b { color: var(--ink); font-weight: 500; }
details { font-size: 13px; border-top: 1px dashed var(--line); padding-top: 8px; }
summary { cursor: pointer; color: var(--accent); }
.official { color: var(--muted); margin: 8px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.75; }
.official strong { color: var(--ink); font-weight: 500; }
a { color: var(--accent); }
.empty { padding: 28px 18px; color: var(--muted); text-align: center; }
footer { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
@media (max-width: 520px) {
  h1 { font-size: 25px; }
  .item { grid-template-columns: minmax(0, 1fr); gap: 6px; padding: 16px 14px; }
  .date { display: flex; gap: 6px; align-items: baseline; padding-top: 0; }
  .date b { display: inline; font-size: 14px; color: var(--muted); font-weight: 500; }
}
</style>

<div class="wrap">
  <header>
    <h1>車主法規快報</h1>
    <p class="lede">政府公告自動擷取，篩出跟開車、騎車有關的，改寫成白話。</p>
  </header>

  <div class="meta" id="meta"></div>
  <div class="notice">原型展示。白話摘要由 AI 依官方總說明撰寫，可能有誤，請以每則下方的公報原文為準。</div>

  <div class="filters">
    <div class="group" id="aud"><span>對象</span></div>
    <div class="group" id="topic"><span>主題</span></div>
    <div class="count" id="count"></div>
  </div>

  <div class="list" id="list"></div>

  <footer>
    <div id="sources"></div>
    <div>未涵蓋：公路局網站（有防機器人機制，不擷取）、各縣市政府與警察局的取締公告。</div>
  </footer>
</div>

<script>
const DATA = /*__DATA__*/;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const state = { aud: "一般車主", topic: "全部" };
try {
  const saved = JSON.parse(localStorage.getItem("carnews-filter") || "null");
  if (saved && typeof saved.aud === "string" && typeof saved.topic === "string") Object.assign(state, saved);
} catch (e) {}

const auds = ["一般車主", "營業車", "車廠與業者", "全部"];
const topics = ["全部", ...new Set(DATA.items.flatMap(i => i.topics))];
if (!auds.includes(state.aud)) state.aud = "一般車主";
if (!topics.includes(state.topic)) state.topic = "全部";

function chips(el, values, key) {
  for (const v of values) {
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.textContent = v; b.id = `chip-${key}-${v}`;
    b.addEventListener("click", () => { state[key] = v; save(); render(); });
    el.appendChild(b);
  }
}
function save() { try { localStorage.setItem("carnews-filter", JSON.stringify(state)); } catch (e) {} }

function render() {
  for (const [key, id] of [["aud", "aud"], ["topic", "topic"]])
    document.querySelectorAll(`#${id} .chip`).forEach(b => b.setAttribute("aria-pressed", String(b.textContent === state[key])));

  const rows = DATA.items.filter(i =>
    (state.aud === "全部" || i.audience === state.aud) &&
    (state.topic === "全部" || i.topics.includes(state.topic)));
  document.getElementById("count").textContent = `顯示 ${rows.length} 則，共 ${DATA.items.length} 則`;

  const list = document.getElementById("list");
  if (!rows.length) { list.innerHTML = `<div class="empty">這個條件下，近兩週沒有相關公告。</div>`; return; }
  list.innerHTML = rows.map(i => {
    const [y, m, d] = (i.date || "").split("-");
    const draft = i.kind === "草案預告";
    const p = i.plain;
    return `<article class="item">
      <div class="date"><b>${esc(Number(m))}/${esc(Number(d))}</b>${esc(y)}</div>
      <div class="body">
        <div class="tags">
          <span class="tag ${draft ? "draft" : "ok"}">${draft ? "草案，尚未生效" : "已發布"}</span>
          ${i.topics.map(t => `<span class="tag">${esc(t)}</span>`).join("")}
          <span class="tag plain">${esc(i.agency.replace(/;/g, "、"))}</span>
        </div>
        <h2>${esc(p ? p.headline : i.title)}</h2>
        ${p ? `<ul class="points">${p.points.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
        <p class="impact"><b>${esc(p.effective)}</b>　${esc(p.impact)}</p>` : ""}
        <details>
          <summary>官方原文與總說明</summary>
          <p class="official"><strong>${esc(i.title)}</strong>\n${esc(i.explanation || "（這則公告沒有附總說明）")}</p>
          <p><a href="${esc(i.url)}" target="_blank" rel="noopener">開啟行政院公報原文</a></p>
        </details>
      </div>
    </article>`;
  }).join("");
}

document.getElementById("meta").innerHTML =
  `<span>資料擷取時間 ${esc(DATA.generated_at.replace("T", " ").slice(0, 16))}</span>` +
  `<span>涵蓋 ${esc(DATA.range[0])} 至 ${esc(DATA.range[1])}</span>`;
document.getElementById("sources").textContent = "本次擷取：" +
  Object.entries(DATA.fetched_counts).map(([k, v]) => `${k} ${v} 則`).join("、") +
  `，篩出 ${DATA.items.length} 則與車輛相關。`;
chips(document.getElementById("aud"), auds, "aud");
chips(document.getElementById("topic"), topics, "topic");
render();
</script>
